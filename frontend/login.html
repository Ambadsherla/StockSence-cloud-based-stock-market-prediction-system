<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense — Sign in</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
</script>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1a1a1a; --border:#e3e7ea; --muted:#8a97a0; --err:#e5484d; color-scheme: light; }
  [data-theme="dark"] { --bg:#0e1318; --card:#151b22; --text:#e6edf3; --border:#27313b; --muted:#8b98a5; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
  .brand { font-size: 26px; font-weight: 800; color: #00b386; text-align: center; }
  .brand span { color: var(--text); }
  .sub { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 20px; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px; font-size: 14px; font-weight: 700; color: var(--muted);
                 cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: #00b386; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid #00b386; outline-offset: -1px; }
  .go { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px; background: #00b386; color: #fff;
        font-size: 14px; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  .theme { display: block; margin: 16px auto 0; background: none; border: 1px solid var(--border); color: var(--muted);
           border-radius: 6px; padding: 3px 12px; font-size: 11.5px; cursor: pointer; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">Stock<span>Sense</span></div>
  <div class="sub">Cloud-Based Stock Market Prediction System</div>
  <div class="tabs">
    <button id="tLogin" class="on" onclick="mode('login')">Sign in</button>
    <button id="tReg" onclick="mode('register')">Create account</button>
  </div>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" autofocus>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <div id="codeWrap" class="hide">
    <label for="c">Invite code (if you were given one)</label>
    <input id="c" autocomplete="off">
  </div>
  <button class="go" id="go" onclick="submit()">Sign in</button>
  <div class="err" id="err"></div>
  <button class="theme" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
</div>
<script>
  let m = 'login';
  const $ = id => document.getElementById(id);
  function mode(x) {
    m = x;
    $('tLogin').classList.toggle('on', x === 'login'); $('tReg').classList.toggle('on', x === 'register');
    $('codeWrap').classList.toggle('hide', x === 'login');
    $('go').textContent = x === 'login' ? 'Sign in' : 'Create account';
    $('p').autocomplete = x === 'login' ? 'current-password' : 'new-password';
    $('err').textContent = '';
  }
  async function submit() {
    $('go').disabled = true; $('err').textContent = '';
    try {
      const res = await fetch(m === 'login' ? '/api/login' : '/api/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('u').value, password: $('p').value, code: $('c').value })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { location.href = '/'; return; }
      $('err').textContent = data.error || 'Something went wrong (HTTP ' + res.status + ').';
    } catch (e) { $('err').textContent = 'Cannot reach the server.'; }
    $('go').disabled = false;
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  function isDark() { return document.documentElement.dataset.theme === 'dark'; }
  function sync() { $('themeBtn').textContent = isDark() ? 'Light mode' : 'Dark mode'; }
  function toggleTheme() {
    const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {} sync();
  }
  sync();
</script>
</body>
</html>

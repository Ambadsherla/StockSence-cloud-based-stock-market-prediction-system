<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense — Sign in</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
</script>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1a1a1a; --border:#e3e7ea; --muted:#8a97a0; --err:#e5484d; color-scheme: light; }
  [data-theme="dark"] { --bg:#0e1318; --card:#151b22; --text:#e6edf3; --border:#27313b; --muted:#8b98a5; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
  .brand { font-size: 26px; font-weight: 800; color: #00b386; text-align: center; }
  .brand span { color: var(--text); }
  .sub { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 20px; }
  .tabs { display: flex; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px; font-size: 14px; font-weight: 700; color: var(--muted);
                 cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: #00b386; }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid #00b386; outline-offset: -1px; }
  .remember { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .go { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px; background: #00b386; color: #fff;
        font-size: 14px; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  .theme { display: block; margin: 16px auto 0; background: none; border: 1px solid var(--border); color: var(--muted);
           border-radius: 6px; padding: 3px 12px; font-size: 11.5px; cursor: pointer; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">Stock<span>Sense</span></div>
  <div class="sub">Cloud-Based Stock Market Prediction System</div>
  <div class="tabs">
    <button type="button" id="tLogin" class="on" onclick="setMode('login')">Sign in</button>
    <button type="button" id="tReg" onclick="setMode('register')">Create account</button>
  </div>
  <div class="hint" id="hint">Sign in with your existing account.</div>

  <label for="u">Username</label>
  <input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
  <label for="p">Password</label>
  <input type="password" id="p" autocomplete="current-password">

  <div id="regWrap" class="hide">
    <label for="p2">Confirm password</label>
    <input type="password" id="p2" autocomplete="new-password">
    <label for="c">Invite code (if you were given one)</label>
    <input type="text" id="c" autocomplete="off">
  </div>

  <label class="remember"><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
  <button type="button" class="go" id="go" onclick="doSubmit()">Sign in</button>
  <div class="err" id="err"></div>
  <button type="button" class="theme" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
</div>
<script>
  let m = 'login';
  const $ = id => document.getElementById(id);

  function setMode(x) {
    m = x;
    const reg = x === 'register';
    $('tLogin').classList.toggle('on', !reg);
    $('tReg').classList.toggle('on', reg);
    $('regWrap').classList.toggle('hide', !reg);
    $('go').textContent = reg ? 'Create account' : 'Sign in';
    $('hint').textContent = reg ? 'New here? Pick a username and password.' : 'Sign in with your existing account.';
    $('p').autocomplete = reg ? 'new-password' : 'current-password';
    $('p').value = ''; $('p2').value = '';
    $('err').textContent = '';
  }

  async function doSubmit() {
    const reg = m === 'register';
    $('err').textContent = '';
    if (!$('u').value.trim() || !$('p').value) { $('err').textContent = 'Enter username and password.'; return; }
    if (reg && $('p').value !== $('p2').value) { $('err').textContent = 'Passwords do not match.'; return; }
    $('go').disabled = true;
    const body = { username: $('u').value.trim(), password: $('p').value, remember: $('rem').checked };
    if (reg) { body.confirm = $('p2').value; body.code = $('c').value; }
    try {
      const res = await fetch(reg ? '/api/register' : '/api/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { location.replace('/'); return; }
      $('err').textContent = data.error || 'Something went wrong (HTTP ' + res.status + ').';
    } catch (e) { $('err').textContent = 'Cannot reach the server.'; }
    $('go').disabled = false;
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });

  // Already signed in (also when arriving via Back button)? Skip the login page.
  async function checkSession() {
    try {
      const r = await fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' });
      if (r.ok) location.replace('/');
    } catch (e) {}
  }
  checkSession();
  window.addEventListener('pageshow', e => { if (e.persisted) checkSession(); });

  function isDark() { return document.documentElement.dataset.theme === 'dark'; }
  function sync() { $('themeBtn').textContent = isDark() ? 'Light mode' : 'Dark mode'; }
  function toggleTheme() {
    const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {} sync();
  }
  sync();
</script>
</body>
</html>
